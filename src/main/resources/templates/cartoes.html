<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Casa Automática — Cartões</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/style.css(v=13)}" />
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-icon"></div>
            <div class="logo-text">CASA<span>AUTOMÁTICA</span></div>
        </div>

        <nav class="main-nav" aria-label="Navegação principal">
            <a class="nav-link" th:href="@{/}">Painel</a>
            <a class="nav-link" th:href="@{/logs}">Logs</a>
            <a class="nav-link active" th:href="@{/cartoes}">Cartões</a>
        </nav>

        <div class="header-right">
            <div class="status-badge">
                <div class="status-dot"></div>
                SISTEMA ONLINE
            </div>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-btn">SAIR</button>
            </form>
        </div>
    </header>

    <main>
        <section class="dashboard-section" id="section-cards">
            <div class="section-header">
                <div class="section-title">Cartões RFID</div>
                <div class="section-count">Salvar <span>nome da pessoa</span></div>
            </div>
            <p class="cards-help">
                Só nesta tela é possível cadastrar ou alterar o nome associado a cada cartão lido na porta.
            </p>
            <div class="event-list" id="cards-list">
                <div class="loading">carregando cartões...</div>
            </div>
        </section>
    </main>

    <div id="toast"></div>

    <script>
        const API_CARDS = '/api/porta/cartoes';

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function apiFetch(url, options = {}) {
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
            const headers = { ...(options.headers || {}) };
            const method = (options.method || 'GET').toUpperCase();
            if (csrfToken && method !== 'GET' && method !== 'HEAD') {
                headers[csrfHeader] = csrfToken;
            }
            const res = await fetch(url, { ...options, headers, credentials: 'same-origin' });
            if (res.status === 401) {
                window.location.href = '/login';
                throw new Error('Não autenticado');
            }
            return res;
        }

        function cardNameForm(uid, nome) {
            return `
                <form class="card-name-form" data-uid="${escapeHtml(uid)}">
                    <input class="card-name-input" type="text" maxlength="120"
                        placeholder="Nome da pessoa"
                        value="${escapeHtml(nome)}"
                        aria-label="Nome da pessoa do cartão ${escapeHtml(uid)}" />
                    <button type="submit" class="all-toggle on card-name-save">SALVAR</button>
                </form>`;
        }

        function bindCardForms(root) {
            root.querySelectorAll('.card-name-form').forEach(form => {
                form.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const uid = form.dataset.uid;
                    const input = form.querySelector('.card-name-input');
                    const nome = (input?.value || '').trim();
                    if (!nome) {
                        showToast('Informe o nome da pessoa');
                        return;
                    }
                    try {
                        const res = await apiFetch(`${API_CARDS}/${encodeURIComponent(uid)}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ nome })
                        });
                        if (!res.ok) throw new Error('save');
                        const data = await res.json();
                        showToast(`Nome salvo: ${data.nome}`);
                        await loadCards();
                    } catch {
                        showToast('Erro ao salvar nome do cartão');
                    }
                });
            });
        }

        async function loadCards() {
            const list = document.getElementById('cards-list');
            try {
                const res = await apiFetch(API_CARDS);
                if (!res.ok) throw new Error('cards');
                const data = await res.json();
                const cards = Array.isArray(data.cards) ? data.cards : [];
                if (!cards.length) {
                    list.innerHTML = '<div class="loading">nenhum cartão lido ainda — passe um cartão na porta</div>';
                    return;
                }
                list.innerHTML = cards.map(c => `
                    <article class="event-row">
                        <div class="event-main">
                            <div class="event-title">${c.nome ? escapeHtml(c.nome) : 'Sem nome'}</div>
                            <div class="event-meta">
                                <span>UID: ${escapeHtml(c.cardUid || '—')}</span>
                            </div>
                            ${c.cardUid ? cardNameForm(c.cardUid, c.nome || '') : ''}
                        </div>
                        <div class="event-badge">${c.nome ? 'CADASTRADO' : 'NOVO'}</div>
                    </article>`).join('');
                bindCardForms(list);
            } catch {
                list.innerHTML = '<div class="loading">erro ao carregar cartões</div>';
            }
        }

        loadCards();
        setInterval(loadCards, 15000);
    </script>
</body>

</html>
