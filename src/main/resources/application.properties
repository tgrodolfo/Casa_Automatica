spring.application.name=CasaAutomatica

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:CasaAutomatica}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8000
server.forward-headers-strategy=framework
server.servlet.session.persistent=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Segurança — obrigatório definir via variáveis de ambiente ou application-local.properties (gitignored)
casa-automatica.security.user.name=${CASA_AUTOMATICA_USER:admin}
casa-automatica.security.user.password=${CASA_AUTOMATICA_PASSWORD:}
casa-automatica.security.device-api-key=${CASA_AUTOMATICA_DEVICE_API_KEY:}
casa-automatica.security.alexa-skill-id=${CASA_AUTOMATICA_ALEXA_SKILL_ID:}
casa-automatica.security.rate-limit.requests-per-minute=${CASA_AUTOMATICA_RATE_LIMIT:120}
